apiVersion: v1
kind: Namespace
metadata:
  name: kungfu-chess

---
# ─── PostgreSQL ──────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kungfu-chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "kungfu_chess"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: init-sql-config

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kungfu-chess
spec:
  selector:
    app: postgres
  ports:
    - port: 5432

---
# ─── Redis ───────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kungfu-chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--save", "60", "1", "--loglevel", "notice"]

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kungfu-chess
spec:
  selector:
    app: redis
  ports:
    - port: 6379

---
# ─── Game Server (C++ WebSocket) ─────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kungfu-game-server
  namespace: kungfu-chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kungfu-game-server
  template:
    metadata:
      labels:
        app: kungfu-game-server
    spec:
      containers:
        - name: game-server
          image: kungfu-chess-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "kungfu_chess"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: kungfu-game-server
  namespace: kungfu-chess
spec:
  type: LoadBalancer
  selector:
    app: kungfu-game-server
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kungfu-game-server-hpa
  namespace: kungfu-chess
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kungfu-game-server
  minReplicas: 1
  maxReplicas: 400
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# ─── Secrets ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: kungfu-chess
type: Opaque
data:
  username: c2hpcmE=
  password: eW91cl9wYXNzd29yZA==

---
# ─── Persistent Volume Claim (PostgreSQL data) ───────────────────────────────

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kungfu-chess
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
